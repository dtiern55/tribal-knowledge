name: Deploy production

# Prod ships on a release, not on merge to main (issue #150, decided
# 2026-09-02). Merges land on staging first (deploy-staging.yml). When
# staging looks right, "Run workflow" here (or `gh release create vX`)
# promotes main: migrations, then the Fly backend, then the `production`
# branch that Vercel builds the frontend from. The button creates the
# release last, so a failed deploy leaves no tag behind.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v3'
        required: true
  push:
    tags: ['v*']

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write # fast-forwards the production branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the push below needs the history behind the tag

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend
        run: flyctl deploy --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Migrations land before the app deploys, so a failed or unhealthy
      # deploy leaves the old image on a new schema (issue #119). This step
      # turns that window into a failed (and emailed) workflow run instead
      # of a silent one. Retries cover the Fly cold start.
      - name: Verify backend health
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 5 --retry-all-errors \
            https://tribal-knowledge-app.fly.dev/health

      # Vercel's production branch is `production`, so the frontend only
      # moves once the backend behind it is healthy. Fast-forward only: a
      # tag off a side branch is rejected here rather than shipped.
      - name: Promote frontend
        run: git push origin HEAD:refs/heads/production

      # A tag made with GITHUB_TOKEN doesn't re-trigger this workflow.
      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        run: gh release create "${{ inputs.version }}" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
