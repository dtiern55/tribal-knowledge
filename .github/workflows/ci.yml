name: CI

on:
  # Every PR, whatever it targets, so stacked PRs get tested too.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check formatting
        run: uv run black --check .

      - name: Lint
        run: uv run ruff check .

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        working-directory: .
        run: supabase start

      - name: Run tests (full suite against local Supabase)
        run: uv run pytest -q --tb=short

  # Vercel builds on its own, but nothing in-repo gated merges on the
  # frontend compiling until this job (issue #118).
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The npm audit endpoint itself goes down now and then (#632); retry
      # those, but a real high-severity finding still fails the job.
      - name: Audit dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high 2>&1 | tee audit.log; then exit 0; fi
            grep -q "audit endpoint returned an error" audit.log || exit 1
            echo "npm audit endpoint error (attempt $attempt), retrying"
            sleep 20
          done
          echo "::warning::npm audit endpoint unavailable after 3 attempts; skipped"

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
