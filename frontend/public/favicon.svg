<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Tribal Knowledge — Final Tribal fire</title>
  <rect width="512" height="512" rx="96" fill="#14628c"/>

  <!-- Three seats around the fire: the final three at Final Tribal Council. -->
  <circle
    cx="256"
    cy="256"
    r="166"
    fill="none"
    stroke="#f3e3c3"
    stroke-width="62"
    stroke-linecap="round"
    stroke-dasharray="247 100.67"
    stroke-dashoffset="-50.33"
    transform="rotate(30 256 256)"
  />

  <!-- One broad diagonal cut gives the flame a hand-carved character. -->
  <g transform="translate(-16 16)">
    <path
      fill="#d5621b"
      d="M256 361
       C207 357 176 328 176 286
       C176 249 198 224 225 197
       C250 171 259 139 250 105
       C291 129 313 162 311 198
       C310 219 300 237 285 251
       C306 244 321 227 329 205
       C358 242 365 288 344 322
       C326 350 293 363 256 361Z"
    />
    <path
      fill="#14628c"
      d="M196 287
       C227 276 260 258 285 235
       C296 225 303 214 309 201
       C311 235 298 264 273 283
       C249 302 237 322 241 347
       C221 337 205 316 196 287Z"
    />
  </g>
</svg>
