<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Tribal Knowledge — Final Tribal fire</title>
  <rect width="512" height="512" rx="96" fill="#14628c"/>

  <!-- Three seats around the fire: the final three at Final Tribal Council. -->
  <circle
    cx="256"
    cy="256"
    r="166"
    fill="none"
    stroke="#f3e3c3"
    stroke-width="62"
    stroke-linecap="round"
    stroke-dasharray="247 100.67"
    stroke-dashoffset="-50.33"
    transform="rotate(30 256 256)"
  />

  <!-- A forked outer edge keeps the flame expressive without an interior cut. -->
  <g transform="translate(-16 16)">
    <path
      fill="#d5621b"
      d="M256 361
       C207 358 176 328 176 286
       C176 249 198 224 225 197
       C249 172 258 140 249 106
       C286 127 305 158 303 193
       C302 213 294 231 282 246
       C305 238 322 217 330 191
       C361 230 368 281 347 319
       C329 351 295 364 256 361Z"
    />
  </g>
</svg>
