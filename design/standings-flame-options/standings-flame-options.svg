<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e7d2"/>
      <stop offset="1" stop-color="#e9dcc3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a1613" flood-opacity=".14"/>
    </filter>
    <path id="flame" d="M12 2c1 4 5 5 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-10z"/>
    <g id="lit">
      <use href="#flame" fill="#d4913a"/>
    </g>
    <g id="smoke">
      <path d="M8 19.1c.9-2 2.3-3.1 4-3.1 1.8 0 3.2 1.1 4 3.1-.7 1.2-2.1 1.9-4 1.9-1.8 0-3.2-.7-4-1.9z" fill="#715c47"/>
      <circle cx="12" cy="17.4" r="1.05" fill="#c45432"/>
      <path d="M12.1 15.3c-2-2.1 2.4-3.1-.2-5.7-2.2-2.2 2.7-3.7.7-6.4" fill="none" stroke="#715c47" stroke-width="1.9" stroke-linecap="round"/>
    </g>
    <g id="ember">
      <path d="m5.5 18 3-3 3.1.7 2.7-2.2 4.2 3.9-1.2 3H6.4z" fill="#715c47"/>
      <path d="m8.5 15 3.1.7 2.7-2.2 2.2 2-3.6 1.5z" fill="#8b7358"/>
      <circle cx="14.5" cy="18.1" r="1.35" fill="#c45432"/>
    </g>
    <g id="struck">
      <use href="#flame" fill="none" stroke="#715c47" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M5 19 19 5" stroke="#7e3625" stroke-width="3.2" stroke-linecap="round"/>
    </g>
    <style>
      .display { font-family: Rajdhani, "Arial Narrow", sans-serif; }
      .body { font-family: "Source Sans 3", Arial, sans-serif; }
      .caps { letter-spacing: 2.2px; font-weight: 700; }
      .title { fill: #172e26; font-size: 39px; font-weight: 750; }
      .subtitle { fill: #715c47; font-size: 18px; }
      .option-title { fill: #172e26; font-size: 25px; font-weight: 750; letter-spacing: 1.1px; }
      .option-copy { fill: #715c47; font-size: 15px; }
      .row-name { fill: #1c1917; font-size: 18px; font-weight: 650; }
      .row-rank { fill: #8b7358; font-size: 20px; font-weight: 750; }
      .row-points { fill: #10221c; font-size: 20px; font-weight: 750; }
      .micro { fill: #8b7358; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
      .verdict { fill: #172e26; font-size: 16px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="url(#ground)"/>
  <circle cx="1370" cy="-20" r="330" fill="#c45432" opacity=".055"/>
  <text x="72" y="80" class="display title">Snuffed flame directions</text>
  <text x="72" y="114" class="body subtitle">Same 16px footprint, but a different silhouette—not just a different color.</text>

  <!-- Option A -->
  <g transform="translate(72 156)">
    <rect width="410" height="748" rx="24" fill="#f2e9db" stroke="#d5c4ad" filter="url(#shadow)"/>
    <rect x="24" y="24" width="124" height="28" rx="14" fill="#2e6b52"/>
    <text x="86" y="43" text-anchor="middle" class="body caps" fill="#fff" font-size="11">RECOMMENDED</text>
    <text x="24" y="91" class="display option-title">A · Smoke curl</text>
    <text x="24" y="119" class="body option-copy">The flame is gone; a wisp marks this week’s loss.</text>

    <rect x="24" y="152" width="362" height="124" rx="16" fill="#f8f2e8" stroke="#e4d8c7"/>
    <text x="44" y="179" class="display caps" fill="#172e26" font-size="11">LEAGUE</text>
    <line x1="24" y1="191" x2="386" y2="191" stroke="#e4d8c7"/>
    <text x="45" y="238" text-anchor="middle" class="display row-rank">2</text>
    <text x="76" y="226" class="display row-name">Danny</text>
    <rect x="76" y="236" width="34" height="17" rx="3" fill="#2e6b52"/>
    <text x="93" y="248" text-anchor="middle" class="body" fill="#fff" font-size="9" font-weight="750">YOU</text>
    <g transform="translate(128 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(150 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(172 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(194 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(216 212) scale(.67)"><use href="#smoke"/></g>
    <text x="363" y="229" text-anchor="end" class="display row-points">127</text>
    <text x="363" y="247" text-anchor="end" class="body" fill="#255943" font-size="11" font-weight="650">+18</text>

    <text x="24" y="321" class="display caps micro">MAGNIFIED STATES</text>
    <rect x="24" y="340" width="362" height="238" rx="18" fill="#eee8df"/>
    <line x1="205" y1="370" x2="205" y2="536" stroke="#d5c4ad"/>
    <g transform="translate(91 383) scale(5)"><use href="#lit"/></g>
    <g transform="translate(239 383) scale(5)"><use href="#smoke"/></g>
    <text x="114" y="552" text-anchor="middle" class="body micro">LIT</text>
    <text x="296" y="552" text-anchor="middle" class="body micro">SNUFFED</text>

    <circle cx="38" cy="625" r="5" fill="#2e6b52"/>
    <text x="55" y="631" class="body verdict">Best narrative read</text>
    <circle cx="38" cy="660" r="5" fill="#2e6b52"/>
    <text x="55" y="666" class="body verdict">Distinct by shape and height</text>
    <circle cx="38" cy="695" r="5" fill="#b97928"/>
    <text x="55" y="701" class="body verdict">Needs a crisp 1.5–2px smoke stroke</text>
  </g>

  <!-- Option B -->
  <g transform="translate(515 156)">
    <rect width="410" height="748" rx="24" fill="#f2e9db" stroke="#d5c4ad" filter="url(#shadow)"/>
    <text x="24" y="91" class="display option-title">B · Cold ember</text>
    <text x="24" y="119" class="body option-copy">A low ash mark leaves the lineup visibly shorter.</text>

    <rect x="24" y="152" width="362" height="124" rx="16" fill="#f8f2e8" stroke="#e4d8c7"/>
    <text x="44" y="179" class="display caps" fill="#172e26" font-size="11">LEAGUE</text>
    <line x1="24" y1="191" x2="386" y2="191" stroke="#e4d8c7"/>
    <text x="45" y="238" text-anchor="middle" class="display row-rank">2</text>
    <text x="76" y="226" class="display row-name">Danny</text>
    <rect x="76" y="236" width="34" height="17" rx="3" fill="#2e6b52"/>
    <text x="93" y="248" text-anchor="middle" class="body" fill="#fff" font-size="9" font-weight="750">YOU</text>
    <g transform="translate(128 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(150 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(172 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(194 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(216 212) scale(.67)"><use href="#ember"/></g>
    <text x="363" y="229" text-anchor="end" class="display row-points">127</text>
    <text x="363" y="247" text-anchor="end" class="body" fill="#255943" font-size="11" font-weight="650">+18</text>

    <text x="24" y="321" class="display caps micro">MAGNIFIED STATES</text>
    <rect x="24" y="340" width="362" height="238" rx="18" fill="#eee8df"/>
    <line x1="205" y1="370" x2="205" y2="536" stroke="#d5c4ad"/>
    <g transform="translate(91 383) scale(5)"><use href="#lit"/></g>
    <g transform="translate(239 383) scale(5)"><use href="#ember"/></g>
    <text x="114" y="552" text-anchor="middle" class="body micro">LIT</text>
    <text x="296" y="552" text-anchor="middle" class="body micro">SNUFFED</text>

    <circle cx="38" cy="625" r="5" fill="#2e6b52"/>
    <text x="55" y="631" class="body verdict">Strongest at a glance</text>
    <circle cx="38" cy="660" r="5" fill="#2e6b52"/>
    <text x="55" y="666" class="body verdict">Makes attrition feel physical</text>
    <circle cx="38" cy="695" r="5" fill="#b97928"/>
    <text x="55" y="701" class="body verdict">Meaning is less explicit than smoke</text>
  </g>

  <!-- Option C -->
  <g transform="translate(958 156)">
    <rect width="410" height="748" rx="24" fill="#f2e9db" stroke="#d5c4ad" filter="url(#shadow)"/>
    <text x="24" y="91" class="display option-title">C · Struck flame</text>
    <text x="24" y="119" class="body option-copy">The old symbol remains, but reads as unavailable.</text>

    <rect x="24" y="152" width="362" height="124" rx="16" fill="#f8f2e8" stroke="#e4d8c7"/>
    <text x="44" y="179" class="display caps" fill="#172e26" font-size="11">LEAGUE</text>
    <line x1="24" y1="191" x2="386" y2="191" stroke="#e4d8c7"/>
    <text x="45" y="238" text-anchor="middle" class="display row-rank">2</text>
    <text x="76" y="226" class="display row-name">Danny</text>
    <rect x="76" y="236" width="34" height="17" rx="3" fill="#2e6b52"/>
    <text x="93" y="248" text-anchor="middle" class="body" fill="#fff" font-size="9" font-weight="750">YOU</text>
    <g transform="translate(128 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(150 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(172 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(194 212) scale(.67)"><use href="#lit"/></g>
    <g transform="translate(216 212) scale(.67)"><use href="#struck"/></g>
    <text x="363" y="229" text-anchor="end" class="display row-points">127</text>
    <text x="363" y="247" text-anchor="end" class="body" fill="#255943" font-size="11" font-weight="650">+18</text>

    <text x="24" y="321" class="display caps micro">MAGNIFIED STATES</text>
    <rect x="24" y="340" width="362" height="238" rx="18" fill="#eee8df"/>
    <line x1="205" y1="370" x2="205" y2="536" stroke="#d5c4ad"/>
    <g transform="translate(91 383) scale(5)"><use href="#lit"/></g>
    <g transform="translate(239 383) scale(5)"><use href="#struck"/></g>
    <text x="114" y="552" text-anchor="middle" class="body micro">LIT</text>
    <text x="296" y="552" text-anchor="middle" class="body micro">SNUFFED</text>

    <circle cx="38" cy="625" r="5" fill="#2e6b52"/>
    <text x="55" y="631" class="body verdict">Most conventional UI signal</text>
    <circle cx="38" cy="660" r="5" fill="#2e6b52"/>
    <text x="55" y="666" class="body verdict">Survives monochrome</text>
    <circle cx="38" cy="695" r="5" fill="#b97928"/>
    <text x="55" y="701" class="body verdict">Feels more “disabled” than “snuffed”</text>
  </g>

  <text x="72" y="946" class="body" fill="#715c47" font-size="15">All three preserve the current one-icon-per-roster-member model. The eliminated state remains for one scored episode, then disappears.</text>
</svg>
